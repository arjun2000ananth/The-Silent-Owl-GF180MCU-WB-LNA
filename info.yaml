```yaml
# ----- ------ ----- ----- ------ ----- ----- ------ -----
# Chipathon 2026: Project configuration
# LICENSE: Apache License Version 2.0
# Team A38: The Silent Owl — GF180MCU Wide-Band LNA
# ----- ------ ----- ----- ------ ----- ----- ------ -----

project:
  title: "The Silent Owl: GF180MCU Wide-Band LNA"
  team: "A38 The Silent Owl"
  discord: ""

  description: >
    A 5 V GF180MCU wide-band noise-cancelling LNA targeting the
    2.3-2.5 GHz band. The design uses a common-gate RF input stage,
    a cascoded common-source main gain path, an auxiliary cascoded
    common-source noise-cancellation path, on-chip bias generation,
    and an AC-coupled PMOS common-source output stage with RF
    input/output matching networks.

  lvs_config: "lvs_config.json"

  gf_def_ready: false
  ws_def_ready: false
  drc_ready: false
  lvs_ready: false

# Top-level interface:
#   .subckt lna_top vdd rf_in_pad rf_out_pad vss
#
# All bias voltages are generated internally.
# Every physical pad/net is listed individually; no bus notation is used.

pins:
  - name: vss
    io_type: ground

  - name: rf_in_pad
    io_type: analog

  - name: rf_out_pad
    io_type: analog

  - name: vdd
    io_type: power
```
